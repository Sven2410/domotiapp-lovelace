name: domotiapp-lovelace-dev

services:
  homeassistant:
    # ha-lovelace, niet ha-scene: domotiapp-scene heeft een eigen compose met
    # exact diezelfde containernaam, en dan weigert Docker de tweede. Dat kostte
    # op 20 augustus 2026 een halve start voordat duidelijk was dat er een
    # container van een ANDER project op onze poort stond.
    container_name: ha-lovelace
    image: ghcr.io/home-assistant/home-assistant:2026.8
    restart: "no"
    ports:
      - "8127:8123"
    volumes:
      - ./.ha-dev-config:/config
      - ./custom_components/domotiapp_lovelace:/config/custom_components/domotiapp_lovelace
