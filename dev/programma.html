<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Programmakaart &mdash; proefopstelling</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 20px;
    background: #0c0c0a; color: #e8e4de;
    font-family: Roboto, "Noto Sans", "Segoe UI", system-ui, sans-serif;
  }
  h2 { font-size: 12px; font-weight: 600; color: rgba(232,228,222,.5); margin: 18px 0 6px; }
  .rij { display: flex; gap: 20px; align-items: flex-start; }
  .vak { flex: 0 0 auto; }
  .vak small { display: block; font-size: 10px; color: rgba(232,228,222,.38); margin-bottom: 4px; }
  #log {
    position: fixed; inset: auto 0 0 0; height: 90px; overflow: auto;
    background: rgba(18,18,15,.96); border-top: 1px solid rgba(232,228,222,.2);
    font: 12px/1.5 ui-monospace, monospace; padding: 6px 16px;
  }
</style>
</head>
<body>
<!--
  De programmakaart (vaatwasser, wasmachine) zonder Home Assistant, in het
  Nederlands en het Engels. Gemaakt voor 0.81.0 (21 oktober 2026).

  Serveer de repo-map (niet dev/), bijvoorbeeld:
    python -m http.server 8793 --bind 127.0.0.1
  en open http://127.0.0.1:8793/dev/programma.html (of ?taal=en)

  De situaties:
  1. de echte dump van coach 0.110.0: een vaatwasser die wacht op vrijgave;
  2. een vaatwasser zonder coach die draait, met resterende tijd en voortgang;
  3. dezelfde, klaar, met de deur open.
-->
<button id="taalknop" type="button" style="margin-bottom:12px">Taal wisselen</button>
<div id="situaties"></div>
<div id="log"></div>
<script type="module">
if (!customElements.get("home-assistant")) customElements.define("home-assistant", class extends HTMLElement {});
if (!customElements.get("ha-icon")) customElements.define("ha-icon", class extends HTMLElement {});

// De taal van Home Assistant: ?taal=en, of de knop bovenaan.
let TAAL = new URLSearchParams(location.search).get("taal") ?? "nl";

await import(`../custom_components/domotiapp_lovelace/frontend/domotiapp-lovelace.js?t=${Date.now()}`);

const log = (t) => {
  const el = document.getElementById("log");
  el.insertAdjacentHTML("afterbegin", `<div>${new Date().toLocaleTimeString()} ${t}</div>`);
};

const dump = await (await fetch(`../tests/js/vaste-invoer/coach-0.110.0-vaatwasser.json?t=${Date.now()}`)).json();

const st = (entity_id, state, attributes = {}) => ({ entity_id, state, attributes });

/** Een hass met de dump van de coach en een paar toestanden van het apparaat zelf. */
function maakHass(extra = []) {
  const states = {};
  const entities = {};
  for (const e of dump) {
    states[e.entity_id] = st(e.entity_id, e.state, { ...e.attributes });
    entities[e.entity_id] = { entity_id: e.entity_id, device_id: "vw", platform: "domotiapp_coach", translation_key: e.translation_key };
  }
  for (const s of extra) states[s.entity_id] = s;
  return {
    states, entities,
    devices: { vw: { id: "vw", name: "Vaatwasser", manufacturer: "DomotiApp Coach", model: "Vaatwasser" } },
    language: TAAL, locale: { language: TAAL }, user: { name: "proef" }, config: {}, themes: {},
    formatEntityState: (s) => s?.state ?? "",
    async callService(domein, dienst, data) { log(`callService ${domein}.${dienst} ${JSON.stringify(data)}`); },
    async callWS(b) { log(`ws ${b.type}`); return null; },
  };
}

const LOS = { status: "input_select.vw_status", remaining: "input_number.vw_rest", progress: "input_number.vw_voortgang", program: "input_select.vw_programma", door: "input_boolean.vw_klep" };
const draait = [
  st(LOS.status, "Run"), st(LOS.remaining, "84", { unit_of_measurement: "min" }), st(LOS.progress, "40"),
  st(LOS.program, "Eco 50°C"), st(LOS.door, "off"),
];
const klaar = [
  st(LOS.status, "Finished"), st(LOS.remaining, "0", { unit_of_measurement: "min" }), st(LOS.progress, "100"),
  st(LOS.program, "Eco 50°C"), st(LOS.door, "on"),
];

const SITUATIES = [
  ["1. Echte dump coach 0.110.0: wacht op vrijgave", { type: "custom:domotiapp-dishwasher-card", coach: true }, []],
  ["2. Zonder coach: draait", { type: "custom:domotiapp-dishwasher-card", ...LOS }, draait],
  ["3. Zonder coach: klaar, klep open", { type: "custom:domotiapp-dishwasher-card", ...LOS }, klaar],
];

const doel = document.getElementById("situaties");
const kaarten = [];
for (const [titel, config, extra] of SITUATIES) {
  doel.insertAdjacentHTML("beforeend", `<h2>${titel}</h2>`);
  const rij = document.createElement("div");
  rij.className = "rij";
  doel.appendChild(rij);
  for (const breed of [380, 280]) {
    const vak = document.createElement("div");
    vak.className = "vak";
    vak.style.width = `${breed}px`;
    vak.innerHTML = `<small>${breed}px</small>`;
    const kaart = document.createElement("domotiapp-dishwasher-card");
    kaart.setConfig(config);
    kaart.hass = maakHass(extra);
    kaarten.push([kaart, extra]);
    vak.appendChild(kaart);
    rij.appendChild(vak);
  }
}
document.getElementById("taalknop").addEventListener("click", () => {
  TAAL = TAAL === "nl" ? "en" : "nl";
  for (const [k, extra] of kaarten) k.hass = maakHass(extra);
  log(`taal ${TAAL}`);
});
log("klaar");
</script>
</body>
</html>
