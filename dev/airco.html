<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Airco &mdash; proefopstelling</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 0 0 110px;
    background: #0c0c0a; color: #e8e4de;
    font-family: Roboto, "Noto Sans", "Segoe UI", system-ui, sans-serif;
  }
  /* Elk thema zijn eigen vlak: de kaart meet --primary-text-color (zie
     thema.js), en lichte tekst is een donker dashboard. */
  .thema { padding: 8px 20px 20px; }
  .thema.donker { --primary-text-color: #e8e4de; background: #0c0c0a; color: #e8e4de; }
  .thema.licht { --primary-text-color: #1a1a17; background: #f6f5f2; color: #1a1a17; }
  h1 { font-size: 14px; font-weight: 600; margin: 12px 0 0; }
  h2 { font-size: 12px; font-weight: 600; opacity: .55; margin: 18px 0 6px; }
  .rij { display: flex; gap: 20px; align-items: flex-start; }
  .vak { flex: 0 0 auto; }
  .vak small { display: block; font-size: 10px; opacity: .45; margin-bottom: 4px; }
  #log {
    position: fixed; inset: auto 0 0 0; height: 90px; overflow: auto; z-index: 10;
    background: rgba(18,18,15,.96); color: #e8e4de; border-top: 1px solid rgba(232,228,222,.2);
    font: 12px/1.5 ui-monospace, monospace; padding: 6px 16px;
  }
</style>
</head>
<body>
<!--
  De airco-kaart in zes situaties, drie breedtes en twee thema's, zonder Home
  Assistant. Gemaakt op 13 oktober 2026 bij de eerste versie van de kaart.

  Serveer de repo-map (niet dev/), bijvoorbeeld:
    python -m http.server 8792 --bind 127.0.0.1
  en open http://127.0.0.1:8792/dev/airco.html
  (Na een nieuwe build: een NIEUWE poort, de browser houdt ES-modules vast.)

  De situaties:
  1. de echte MELCloud Home-dump: Kantoor raam staat uit;
  2. dezelfde dump, Kantoor deur aan op koelen, ventilator 3, met een storing;
  3. de demo-hvac van Home Assistant: koelt, vochtigheid, ventilator als
     keuzelijst, lamellen en opzij, plus buiten/vermogen/energie op het apparaat;
  4. de demo-ecobee: een bereik (21-24) en programma's;
  5. de demo-warmtepomp: alleen verwarmen;
  6. onbereikbaar.

  Een tik doet echt iets: `callService` logt onderin EN past de nagebootste
  toestand aan, en alle kaarten van die situatie (beide thema's) krijgen een
  nieuwe hass. Zo zijn aan/uit, standen, het doel en de keuzelijsten te
  proberen. Een more-info (tik op de kop of een tegel) wordt alleen gelogd.
-->
<div class="thema donker"><h1>Donker</h1><div class="situaties"></div></div>
<div class="thema licht"><h1>Licht</h1><div class="situaties"></div></div>
<div id="log"></div>
<script type="module">
if (!customElements.get("home-assistant")) customElements.define("home-assistant", class extends HTMLElement {});
if (!customElements.get("ha-icon")) customElements.define("ha-icon", class extends HTMLElement {});

await import(`../custom_components/domotiapp_lovelace/frontend/domotiapp-lovelace.js?t=${Date.now()}`);

const log = (t) => {
  const el = document.getElementById("log");
  el.insertAdjacentHTML("afterbegin", `<div>${new Date().toLocaleTimeString()} ${t}</div>`);
};

const dump = await (await fetch(`../tests/js/vaste-invoer/melcloud-home-airco.json?t=${Date.now()}`)).json();

/* ------------------------------------------------- de demo-airco's van HA */

const demo = {
  hvac: {
    entity_id: "climate.hvac", state: "cool",
    attributes: {
      hvac_modes: ["off", "heat", "cool", "auto", "dry", "fan_only"], min_temp: 7, max_temp: 35,
      fan_modes: ["on_low", "on_high", "auto_low", "auto_high", "off"],
      swing_modes: ["auto", "1", "2", "3", "off"], swing_horizontal_modes: ["auto", "rangefull", "off"],
      current_temperature: 22, temperature: 21, current_humidity: 54.2,
      fan_mode: "on_high", hvac_action: "cooling", swing_mode: "off", swing_horizontal_mode: "auto",
      friendly_name: "Hvac", supported_features: 943,
    },
  },
  ecobee: {
    entity_id: "climate.ecobee", state: "heat_cool",
    attributes: {
      hvac_modes: ["off", "cool", "heat_cool", "auto", "dry", "fan_only"], min_temp: 7, max_temp: 35,
      fan_modes: ["on_low", "on_high", "auto_low", "auto_high", "off"], preset_modes: ["home", "eco", "away"],
      swing_modes: ["auto", "1", "2", "3", "off"],
      current_temperature: 23, target_temp_high: 24, target_temp_low: 21,
      fan_mode: "auto_low", preset_mode: "home", swing_mode: "auto",
      friendly_name: "Ecobee", supported_features: 442,
    },
  },
  heatpump: {
    entity_id: "climate.heatpump", state: "heat",
    attributes: {
      hvac_modes: ["heat", "off"], min_temp: 7, max_temp: 35,
      current_temperature: 25, temperature: 20, hvac_action: "heating",
      friendly_name: "HeatPump", supported_features: 385,
    },
  },
};

/* De demo-hvac krijgt een apparaat met drie sensoren erbij, zodat er vier
   tegels te zien zijn (energie, vermogen, vochtigheid uit de entiteit, buiten). */
const hvacDelen = {
  "sensor.hvac_buiten": { state: "8.4", attributes: { device_class: "temperature", unit_of_measurement: "°C", friendly_name: "Hvac buiten" }, tk: "outdoor_temperature" },
  "sensor.hvac_vermogen": { state: "640", attributes: { device_class: "power", unit_of_measurement: "W", friendly_name: "Hvac vermogen" }, tk: "power" },
  "sensor.hvac_energie_vandaag": { state: "3.27", attributes: { device_class: "energy", unit_of_measurement: "kWh", friendly_name: "Hvac energie vandaag" }, tk: "energy_today" },
};

/* --------------------------------------------------------- de werelden */

const kopie = (x) => structuredClone(x);

/** Een wereld: states, register en apparaten, plus de kaarten die erin kijken. */
function wereld({ states, entities = {}, devices = {} }) {
  const w = { states, entities, devices, kaarten: [] };
  w.hass = () => ({
    states: w.states, entities: w.entities, devices: w.devices,
    language: "nl", locale: { language: "nl" }, user: { name: "proef", is_admin: true },
    config: { unit_system: { temperature: "°C" } }, themes: {},
    callService: async (domein, dienst, data) => {
      log(`callService ${domein}.${dienst} ${JSON.stringify(data)}`);
      speelNa(w, domein, dienst, data);
    },
    callWS: async (b) => { log(`ws ${b.type}`); return null; },
  });
  return w;
}

/** Wat Home Assistant zou doen: de toestand bijwerken en een nieuwe hass sturen. */
function speelNa(w, domein, dienst, data) {
  if (domein !== "climate") return;
  const oud = w.states[data.entity_id];
  if (!oud) return;
  const st = { ...oud, attributes: { ...oud.attributes } };
  const a = st.attributes;
  switch (dienst) {
    case "turn_on": st.state = a._vorige ?? a.hvac_modes.find((m) => m !== "off") ?? "auto"; break;
    case "turn_off": a._vorige = st.state !== "off" ? st.state : a._vorige; st.state = "off"; break;
    case "set_hvac_mode":
      if (data.hvac_mode === "off" && st.state !== "off") a._vorige = st.state;
      st.state = data.hvac_mode; break;
    case "set_temperature":
      if ("temperature" in data) a.temperature = data.temperature;
      if ("target_temp_low" in data) a.target_temp_low = data.target_temp_low;
      if ("target_temp_high" in data) a.target_temp_high = data.target_temp_high;
      break;
    case "set_fan_mode": a.fan_mode = data.fan_mode; break;
    case "set_swing_mode": a.swing_mode = data.swing_mode; break;
    case "set_swing_horizontal_mode": a.swing_horizontal_mode = data.swing_horizontal_mode; break;
    case "set_preset_mode": a.preset_mode = data.preset_mode; break;
    default: return;
  }
  // Een demo-airco met hvac_action: die volgt de stand, zoals in de testinstance.
  if ("hvac_action" in oud.attributes) {
    a.hvac_action = { off: "off", heat: "heating", cool: "cooling", dry: "drying", fan_only: "fan" }[st.state] ?? "idle";
  }
  // Na een tel, zoals een echte airco ook niet meteen antwoordt.
  setTimeout(() => {
    w.states = { ...w.states, [st.entity_id]: st };
    const hass = w.hass();
    for (const k of w.kaarten) k.hass = hass;
  }, 400);
}

const melcloud = (wijzig = {}) => {
  const states = kopie(dump.states);
  for (const [id, w] of Object.entries(wijzig)) states[id] = { ...states[id], ...w, attributes: { ...states[id].attributes, ...(w.attributes ?? {}) } };
  return wereld({ states, entities: dump.entities, devices: dump.devices });
};

function hvacWereld() {
  const states = { "climate.hvac": kopie(demo.hvac) };
  const entities = { "climate.hvac": { entity_id: "climate.hvac", device_id: "dev_hvac", platform: "demo" } };
  for (const [id, d] of Object.entries(hvacDelen)) {
    states[id] = { entity_id: id, state: d.state, attributes: d.attributes };
    entities[id] = { entity_id: id, device_id: "dev_hvac", platform: "demo", translation_key: d.tk };
  }
  return wereld({ states, entities, devices: { dev_hvac: { id: "dev_hvac", name: "Hvac", manufacturer: "Home Assistant", model: "Demo" } } });
}

const SITUATIES = [
  ["1. MELCloud Home, echte dump: Kantoor raam staat uit", melcloud(), "climate.kantoor_raam"],
  ["2. MELCloud Home: Kantoor deur koelt, ventilator 3, met een storing", melcloud({
    "climate.kantoor_deur": { state: "cool", attributes: { temperature: 22, fan_mode: "speed_3", swing_mode: "position_2" } },
    "binary_sensor.kantoor_deur_error": { state: "on" },
  }), "climate.kantoor_deur"],
  ["3. Demo hvac: koelt, ventilator als keuzelijst, lamellen en opzij, vier tegels", hvacWereld(), "climate.hvac"],
  ["4. Demo ecobee: een bereik en programma's", wereld({ states: { "climate.ecobee": kopie(demo.ecobee) } }), "climate.ecobee"],
  ["5. Demo warmtepomp: alleen verwarmen", wereld({ states: { "climate.heatpump": kopie(demo.heatpump) } }), "climate.heatpump"],
  ["6. Onbereikbaar", melcloud({
    "climate.kantoor_raam": { state: "unavailable", attributes: { current_temperature: undefined, temperature: undefined, fan_mode: undefined, swing_mode: undefined, swing_horizontal_mode: undefined } },
  }), "climate.kantoor_raam"],
];

for (const thema of document.querySelectorAll(".thema")) {
  const doel = thema.querySelector(".situaties");
  for (const [titel, w, entity] of SITUATIES) {
    doel.insertAdjacentHTML("beforeend", `<h2>${titel}</h2>`);
    const rij = document.createElement("div");
    rij.className = "rij";
    doel.appendChild(rij);
    for (const breed of [380, 320, 280]) {
      const vak = document.createElement("div");
      vak.className = "vak";
      vak.style.width = `${breed}px`;
      vak.innerHTML = `<small>${breed}px</small>`;
      const kaart = document.createElement("domotiapp-airco-card");
      kaart.dataset.breed = String(breed);
      kaart.dataset.situatie = titel.split(".")[0];
      kaart.setConfig({ type: "custom:domotiapp-airco-card", entity });
      kaart.hass = w.hass();
      kaart.addEventListener("hass-more-info", (e) => log(`more-info ${e.detail.entityId}`));
      w.kaarten.push(kaart);
      vak.appendChild(kaart);
      rij.appendChild(vak);
    }
  }
}
// Voor wie in de console meet: window.__airco.kaarten is elke kaart op de pagina.
window.__airco = { kaarten: [...document.querySelectorAll("domotiapp-airco-card")], SITUATIES };
log("klaar");
</script>
</body>
</html>
