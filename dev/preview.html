  <h1>DomotiApp Cards &mdash; werkbank</h1>

    ergens een rolluik beweegt.
  </p>
  <div class="cols" id="cols"></div>
</div>
<div id="log"><b>Service-aanroepen</b><div id="loglines"></div></div>

<script type="module">
import "./ha-form-stub.js";   // testdubbel: zonder dit bouwt geen enkele editor

// De bundel registreert zijn kaarten pas als Home Assistants eigen frontend er
// is; `home-assistant` is daarvan het signaal (zie src/registratie.js). Op de
// werkbank bestaat dat element niet, dus zetten we de marker zelf neer. Zonder
// dit verschijnt er tien seconden lang niets -- de noodklep -- en dat leest als
// een kapotte bundel terwijl er niets aan de hand is.
if (!customElements.get("home-assistant")) {
  customElements.define("home-assistant", class extends HTMLElement {});
}

// En een stand-in voor `ha-icon`. Onze eigen set is getekende SVG en heeft niets
// nodig, maar alles met een dubbele punt (`mdi:pencil`) laat `resolve()` door
// naar dit element van Home Assistant. Zonder stand-in blijft zo'n icoon hier
// leeg, en dan lijkt een kaart kapot terwijl hij in HA gewoon klopt.
if (!customElements.get("ha-icon")) {
  customElements.define(
    "ha-icon",
    class extends HTMLElement {
      connectedCallback() {
        this.style.display = "grid";
        this.style.placeItems = "center";
        this.style.font = "9px/1 ui-monospace, monospace";
        this.style.color = "currentColor";
        this.textContent = (this.getAttribute("icon") || "?").replace(/^mdi:/, "").slice(0, 3);
      }
    }
  );
}

// Altijd de verse bundel. Zonder die tijdstempel houdt de browser de vorige in
// het geheugen vast, ook na een herlaad -- en zit je naar code te kijken die je
// net vervangen hebt, met een conclusie die nergens op slaat.
await import(`../custom_components/domotiapp_lovelace/frontend/domotiapp-lovelace.js?t=${Date.now()}`);

/* ---------------------------------------------------------------- mock hass */

const now = new Date();
const iso = (h, m) => new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m).toISOString();
const dPlus = (n) => {
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + n);
  const p = (x) => String(x).padStart(2, "0");
  return `${p(d.getDate())}-${p(d.getMonth() + 1)}-${d.getFullYear()}`;
};

const S = (entity_id, state, attributes = {}) => [entity_id, { entity_id, state, attributes }];

  }),

  }),
  S("media_player.radio_keuken", "playing", {
    friendly_name: "Radio keuken",
    supported_features: 4 | 8 | 4096,           // volume|dempen|stop, geen pauze
    media_title: "NPO Radio 2", app_name: "TuneIn",
    volume_level: 0.62, is_volume_muted: true,
  }),
  S("media_player.chromecast", "idle", {

    volume_level: 0.4, shuffle: true, repeat: "all", group_members: [],
  }),

  // Rookmelder: alle vijf de soorten, plus een tweede die alleen rook meldt.
  S("binary_sensor.rook_hal", "off", { friendly_name: "Rook hal", device_class: "smoke" }),
  S("binary_sensor.co_hal", "off", { friendly_name: "CO hal", device_class: "carbon_monoxide" }),
  S("binary_sensor.warmte_hal", "off", { friendly_name: "Warmte hal", device_class: "heat" }),
  S("sensor.temp_hal", "21.4", { friendly_name: "Temperatuur hal",
    device_class: "temperature", unit_of_measurement: "°C" }),

  S("sensor.batterij_zolder", "94", { friendly_name: "Batterij zolder",
    device_class: "battery", unit_of_measurement: "%" }),

  // Een tv-ontvanger zoals het Ziggo-kastje van de eigenaar: 154547 betekent

    supported_features: 154547,
    source: "RTL 4",
    source_list: ["NPO 1", "NPO 2", "NPO 3", "RTL 4", "RTL 5", "SBS6", "RTL 7",
      "Veronica / Disney Jr.", "Net5", "RTL 8", "STAR Channel", "RTL Z", "Viaplay TV",
      "Ziggo Sport 1", "Comedy Central", "Discovery", "ESPN", "Netflix", "Videoland",

      "794 Voorst Veluwezoom", "Omroep Gelderland"],

    media_channel: "RTL 4",
    media_content_type: "channel",
    device_class: "tv",
  }),

  // Een tv zonder eigen volume, met een soundbar die het geluid doet.
  S("media_player.tv_kamer", "playing", {

    supported_features: 1 | 16 | 32 | 16384 | 32768 | 262144 | 524288,
    media_title: "Chernobyl", media_series_title: "Aflevering 3",
  }),
  S("media_player.soundbar", "playing", {

    volume_level: 0.22,
  }),

  S("switch.tuinpomp", "off", { friendly_name: "Druppelslang achtertuin" }),
  S("input_boolean.automatische_beregening", "on", { friendly_name: "Automatische beregening" }),
  S("input_boolean.handmatige_beregening", "off", { friendly_name: "Handmatige beregening" }),
  S("sensor.volgende_cyclus", "Over 10 uur", { friendly_name: "Volgende cyclus" }),
  S("sensor.beregening", "Niet actief", { friendly_name: "Beregening" }),
  S("sensor.beregening_tijd", "0", { friendly_name: "Beregening tijd", unit_of_measurement: "min" }),

  S("input_boolean.slapen", "off", { friendly_name: "Slapen" }),
  S("scene.radio", "unknown", { friendly_name: "Radio" }),
  S("alarm_control_panel.alarm", "disarmed", { friendly_name: "Alarm" }),
  S("climate.woonkamer", "heat", { friendly_name: "Woonkamer", current_temperature: 23.2, temperature: 19.5,
    hvac_action: "heating", min_temp: 5, max_temp: 30 }),
  S("climate.badkamer", "heat", { friendly_name: "Badkamer", current_temperature: 24.2, temperature: 20,
    hvac_action: "idle", min_temp: 5, max_temp: 25 }),
  S("sensor.temp_logeerkamer", "18.4", { friendly_name: "Logeerkamer", device_class: "temperature", unit_of_measurement: "°C" }),
  S("sensor.vocht_slaapkamer", "80", { friendly_name: "Slaapkamer vocht", device_class: "humidity", unit_of_measurement: "%" }),
  S("sensor.eredivisie", "Eredivisie", { friendly_name: "Eredivisie",
    entity_picture: "data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Crect width=%2740%27 height=%2740%27 fill=%27%23d81e2a%27/%3E%3Ctext x=%2720%27 y=%2726%27 font-size=%2718%27 fill=%27white%27 text-anchor=%27middle%27 font-family=%27sans-serif%27%3EE%3C/text%3E%3C/svg%3E" }),
  S("sensor.temp_slaapkamer", "21.3", { friendly_name: "Slaapkamer", device_class: "temperature", unit_of_measurement: "°C" }),
]);

const log = (msg, cls = "") => {
  const el = document.createElement("div");
  el.className = cls;
  el.textContent = `${new Date().toLocaleTimeString("nl")}  ${msg}`;
  document.getElementById("loglines").prepend(el);
};

/** Wat de Python-kant zou bewaren, hier in het geheugen. */
const wsOpslag = {};

/**
 * De nagebootste bibliotheek van Music Assistant.
 *
 * Met echte staat: een hartje dat je aanzet verschijnt in het favorietenblad,
 * een lijst die je maakt blijft staan, en een nummer dat je eruit haalt is weg.
 * Een vaste lijst zou alleen toetsen of er íets getekend wordt.
 */
let wsBiebNr = 100;
const wsBieb = {
  playlists: [
    { name: "Ochtend", uri: "library://playlist/1", media_type: "playlist",
      library_item_id: "1", provider: "library", favorite: true, is_editable: true },
    { name: "Spotify Top 50", uri: "spotify://playlist/2", media_type: "playlist",
      library_item_id: "2", provider: "spotify", favorite: false, is_editable: false },
  ],
  radio: [
    { name: "NPO Radio 2", uri: "radiobrowser://11", media_type: "radio",
      library_item_id: "11", provider: "radiobrowser", favorite: true },
    { name: "Sublime", uri: "radiobrowser://12", media_type: "radio",
      library_item_id: "12", provider: "radiobrowser", favorite: false },
  ],
  tracks: [
    { name: "Says", uri: "library://track/21", media_type: "track", library_item_id: "21",
      provider: "library", favorite: true, artists: ["Nils Frahm"], album: "Spaces" },
    { name: "Re", uri: "library://track/22", media_type: "track", library_item_id: "22",
      provider: "library", favorite: false, artists: ["Nils Frahm"], album: "Spaces" },
  ],
  albums: [
    { name: "Spaces", uri: "library://album/31", media_type: "album", library_item_id: "31",
      provider: "library", favorite: false, artists: ["Nils Frahm"] },
  ],
  artists: [
    { name: "Nils Frahm", uri: "library://artist/41", media_type: "artist",
      library_item_id: "41", provider: "library", favorite: false },
  ],
};
const wsLijstNummers = { 1: [{ ...wsBieb.tracks[0] }, { ...wsBieb.tracks[1] }], 2: [] };
/** Waar hoort deze uri bij? Ook zoekresultaten moeten favoriet kunnen worden. */
function wsBiebZoek(uri) {
  for (const soort of Object.keys(wsBieb)) {
    const gevonden = wsBieb[soort].find((i) => i.uri === uri);
    if (gevonden) return gevonden;
  }
  // Een zoekresultaat dat nog niet in de bibliotheek staat: MA zet hem er dan
  // bij. Dat doen we hier ook, anders kan een hartje op een zoekresultaat niet.
  const soort = { playlist: "playlists", radio: "radio", track: "tracks",
    album: "albums", artist: "artists" }[String(uri).split("://")[1]?.split("/")[0]
    ?? String(uri).split("//")[1]?.split("/")[0]];
  const emmer = wsBieb[soort] ?? wsBieb.tracks;
  const nr = String(wsBiebNr++);
  const nieuw = { name: `Toegevoegd ${nr}`, uri, media_type: soort === "radio" ? "radio" : (soort ?? "tracks").replace(/s$/, ""),
    library_item_id: nr, provider: "library", favorite: false };
  emmer.push(nieuw);
  return nieuw;
}
/** Twee wekkers voor Sven, zodat de wekkerkaart iets te tonen heeft. */
const wsWekkers = {
  "person.sven": [
    { id: "a1", time: "07:00", days: [1, 2, 3, 4, 5], enabled: true, label: "Werk" },
    { id: "a2", time: "09:30", days: [6, 7], enabled: false, label: "Weekend" },
  ],
};
// Dezelfde standaardiconen als DEFAULT_ICONS in de Python-kant en in
// src/scene/const.js. Lopen die uit elkaar, dan toont de kaart iets anders dan
// er in de opslag staat.
const legeScenes = () => ["een", "twee", "drie"].map((icon) => ({ icon, lights: {} }));

const hass = {
  states,
  language: "nl",
  locale: { language: "nl" },
  user: { name: "Sven" },
  config: { unit_system: { wind_speed: "km/h" } },
  themes: {},
  /**
   * De websocket-kant van de scenekaart, nagebootst.
   *
   * De echte commando's komen uit de Python-kant van deze integratie. Hier
   * staat een opslag in het geheugen, zodat de kaart en zijn editor op de
   * werkbank te bedienen zijn zonder Home Assistant erbij. Wat het niet nadoet
   * -- validatie, migratie, reparatiemeldingen -- zit aan de serverkant en
   * heeft eigen Python-tests.
   */
  async callWS(bericht) {
    log(`ws ${bericht.type}  ${JSON.stringify(bericht.entity_id ?? "")}`);
    // Een lichtgroep die niet bestaat levert aan de serverkant een fout op, en
    // daar hoort de kaart de uitlegkaart van te tonen. Zonder deze regel doet
    // de werkbank net alsof elke entiteit bestaat en blijft die toestand
    // ongetest.
    if (bericht.entity_id && !states[bericht.entity_id]) {
      throw Object.assign(new Error(`${bericht.entity_id} bestaat niet`), {
        code: "not_found",
      });
    }
    const leden = (states[bericht.entity_id]?.attributes?.entity_id ?? []).filter(
      (id) => id !== bericht.entity_id
    );
    switch (bericht.type) {
      case "domotiapp_lovelace/scenes/get":
        return { scenes: wsOpslag[bericht.entity_id] ?? legeScenes(), member_entity_ids: leden };
      case "domotiapp_lovelace/scenes/save":
        wsOpslag[bericht.entity_id] = bericht.scenes;
        return { scenes: bericht.scenes, member_entity_ids: leden };
      case "domotiapp_lovelace/snapshot/create":
        return { snapshot_entity_id: "scene.werkbank_snapshot" };
      case "domotiapp_lovelace/snapshot/close":
        return {};
      // ---- de wekkerkant ----
      case "domotiapp_lovelace/alarms/get":
        return { alarms: wsWekkers[bericht.person] ?? [], ringing: null, message: null };
      case "domotiapp_lovelace/alarms/save":
      case "domotiapp_lovelace/alarms/set_enabled":
      case "domotiapp_lovelace/alarms/delete":
      case "domotiapp_lovelace/alarms/clear_message":
        return { alarms: wsWekkers[bericht.person] ?? [], ringing: null, message: null };
      case "domotiapp_lovelace/entities/list":
        return { speakers: [], lights: [] };
      // De mediakant: zoeken en de gelabelde speakers.
      case "domotiapp_lovelace/media/search": {
        const q = String(bericht.query ?? "").trim();
        const alles = [
          { name: `${q} — de afspeellijst`, uri: "library://playlist/1", media_type: "playlist" },
          { name: `${q} Radio`, uri: "radiobrowser://1", media_type: "radio" },
          { name: q, uri: "library://artist/9", media_type: "artist" },
          { name: `${q} (Deluxe)`, uri: "library://album/4", media_type: "album",
            artists: [{ name: "Nils Frahm" }] },
          { name: `${q} in de ochtend`, uri: "library://track/7", media_type: "track",
            artists: [{ name: "Nils Frahm" }], album: { name: "Spaces" } },
          // Een treffer die AL in de bibliotheek staat, zoals MA die ook
          // teruggeeft: hij hoort met een gevuld hartje binnen te komen.
          { name: "Says", uri: "library://track/21", media_type: "track",
            artists: [{ name: "Nils Frahm" }], album: { name: "Spaces" } },
        ];
        const soort = bericht.media_types?.[0];
        const gekozen = soort ? alles.filter((r) => r.media_type === soort) : alles;
        // Zoals de serverkant het sinds 21 augustus 2026 doet: een treffer die
        // uit de BIBLIOTHEEK komt draagt zijn hartje en zijn bibliotheeknummer
        // mee. Zonder dat kwam een nummer dat je net favoriet maakte terug met
        // een leeg hartje, en leek het niet bewaard. Een provider-treffer krijgt
        // ze niet: zijn item_id is dat van Spotify, niet van de bibliotheek.
        return {
          results: gekozen.map((r) => {
            const inBieb = Object.values(wsBieb)
              .flat()
              .find((i) => i.uri === r.uri && i.provider === "library");
            return {
              ...r,
              favorite: Boolean(inBieb?.favorite),
              library_item_id: inBieb ? inBieb.library_item_id : null,
            };
          }),
        };
      }
      // De alarmcode van DomotiApp, nagebootst. De echte staat gehasht aan de
      // serverkant; hier is 4711 de goede.
      case "domotiapp_lovelace/panel/code/status":
        return { has_code: true };
      case "domotiapp_lovelace/panel/code/verify": {
        window.__pogingen = (window.__pogingen ?? 0) + (bericht.code === "4711" ? 0 : 1);
        if (window.__pogingen > 5) {
          throw Object.assign(new Error("Te vaak een verkeerde code. Wacht een minuut."), {
            code: "te_veel_pogingen",
          });
        }
        if (bericht.code === "4711") window.__pogingen = 0;
        return { ok: bericht.code === "4711" };
      }
      // ---- de bibliotheek: een kleine Music Assistant in het geheugen ----
      //
      // Met echt gedrag en niet met vaste lijstjes: een hartje dat aangaat moet
      // in het favorietenblad verschijnen, en een lijst die je maakt moet er de
      // volgende keer nog staan. Anders toetst de werkbank alleen of er iets
      // getekend wordt.
      case "domotiapp_lovelace/media/library": {
        const soort = bericht.kind;
        let items = (wsBieb[soort] ?? []).slice();
        if (bericht.favorite) items = items.filter((i) => i.favorite);
        if (bericht.search) {
          const q = String(bericht.search).toLowerCase();
          items = items.filter((i) => String(i.name).toLowerCase().includes(q));
        }
        return { items: items.slice(0, bericht.limit ?? 50) };
      }
      case "domotiapp_lovelace/media/favorite": {
        if (bericht.favorite) {
          const gevonden = wsBiebZoek(bericht.uri);
          if (gevonden) gevonden.favorite = true;
          else throw new Error("Onbekende uri");
        } else {
          const lijst = wsBieb[bericht.kind] ?? [];
          const item = lijst.find((i) => String(i.library_item_id) === String(bericht.library_item_id));
          if (!item) throw new Error("Niet in de bibliotheek");
          item.favorite = false;
        }
        return { favorite: bericht.favorite };
      }
      case "domotiapp_lovelace/media/playlist/create": {
        const nr = String(wsBiebNr++);
        const lijst = { name: bericht.name, uri: `library://playlist/${nr}`,
          media_type: "playlist", library_item_id: nr, provider: "library",
          favorite: false, is_editable: true };
        wsBieb.playlists.push(lijst);
        wsLijstNummers[nr] = [];
        return { playlist: lijst };
      }
      case "domotiapp_lovelace/media/playlist/remove": {
        wsBieb.playlists = wsBieb.playlists.filter(
          (l) => String(l.library_item_id) !== String(bericht.library_item_id));
        delete wsLijstNummers[bericht.library_item_id];
        return { removed: bericht.library_item_id };
      }
      case "domotiapp_lovelace/media/playlist/tracks":
        return { tracks: (wsLijstNummers[bericht.library_item_id] ?? [])
          .map((t, i) => ({ ...t, position: i })) };
      case "domotiapp_lovelace/media/playlist/add_tracks": {
        const doel = wsLijstNummers[bericht.library_item_id] ?? (wsLijstNummers[bericht.library_item_id] = []);
        for (const uri of bericht.uris) {
          const item = wsBiebZoek(uri);
          if (item) doel.push({ ...item });
        }
        return { added: bericht.uris.length };
      }
      case "domotiapp_lovelace/media/playlist/remove_tracks": {
        const doel = wsLijstNummers[bericht.library_item_id] ?? [];
        const eruit = new Set(bericht.positions);
        wsLijstNummers[bericht.library_item_id] = doel.filter((_, i) => !eruit.has(i));
        return { removed: bericht.positions.length };
      }
      case "domotiapp_lovelace/media/speakers":
        return {
          label_exists: true,
          label_name: "Music Assistant Media",
          entities: [
            { entity_id: "media_player.ma_keuken", name: "Keuken (MA)", can_group: true },
            { entity_id: "media_player.ma_woonkamer", name: "Woonkamer (MA)", can_group: true },
            { entity_id: "media_player.tv_kamer", name: "Tv kamer", can_group: true },
            { entity_id: "media_player.sonos_keuken", name: "Sonos keuken", can_group: false },
          ],
          filtered_out: 0,
        };
      case "domotiapp_lovelace/sound/search":
        return { results: [] };
      case "domotiapp_lovelace/updates/subscribe":
        return {};
      default:
        throw Object.assign(new Error(`onbekend commando ${bericht.type}`), { code: "unknown" });
    }
  },
  /**
   * De weersvoorspelling loopt via een abonnement, niet via een attribuut.
   *
   * Sinds HA 2023.9 hangt de voorspelling niet meer aan de weerentiteit. De
   * werkbank doet dat na, inclusief het opzeggen -- anders is niet te zien dat
   * de kaart zijn abonnement netjes teruggeeft.
   */
  connection: {
    async subscribeMessage(cb, bericht) {
      log(`ws ${bericht.type}  ${bericht.entity_id ?? ""}`);
      if (bericht.type !== "weather/subscribe_forecast") return () => {};
      if (bericht.entity_id === "weather.meteo" && bericht.forecast_type === "hourly") {
        throw new Error("deze bron kent geen uurvoorspelling");
      }
      const dag = 86400000;
      const nu = Date.now();
      const soorten = ["partlycloudy", "rainy", "cloudy", "sunny", "snowy", "fog", "windy", "pouring"];
      const forecast = Array.from({ length: 8 }, (_, i) => ({
        datetime: new Date(nu + i * (bericht.forecast_type === "hourly" ? 3600000 : dag)).toISOString(),
        condition: soorten[i % soorten.length],
        temperature: 19 + ((i * 3) % 7),
        templow: 11 + (i % 4),
        precipitation_probability: (i * 17) % 100,
      }));
      // Een tel later, zoals de echte: de kaart moet ook zonder voorspelling
      // een geldig beeld hebben.
      setTimeout(() => cb({ type: "event", forecast }), 120);
      return () => log("abonnement op de voorspelling opgezegd");
    },
  },
  callService(domain, service, data, target) {
    log(`${domain}.${service}  ${JSON.stringify({ ...data, ...(target ?? {}) })}`);
    // Home Assistant neemt het doel uit `target` óf uit `data.entity_id`. De
    // kaarten gebruiken allebei de vormen, dus de werkbank ook.
    data = { ...data, ...(target ?? {}) };
    // Reflect the call back into the mock, so the card visibly responds.
    const ids = [].concat(data?.entity_id ?? []);
    for (const id of ids) {
      const st = states[id];
      if (!st) continue;
      const next = { ...st, attributes: { ...st.attributes } };
      if (service === "toggle") next.state = st.state === "on" ? "off" : "on";
      if (service === "turn_on") next.state = "on";
      if (service === "turn_off") next.state = "off";
      if (data.brightness_pct != null) {
        next.state = "on";
        next.attributes.brightness = Math.round((data.brightness_pct / 100) * 255);
      }
      // De mediaspeler antwoordt ook, anders lijkt elke knop dood.
      if (service === "media_play") next.state = "playing";
      if (service === "media_pause") next.state = "paused";
      if (service === "media_stop") next.state = "idle";
      if (service === "volume_set") next.attributes.volume_level = data.volume_level;
      if (service === "volume_mute") next.attributes.is_volume_muted = data.is_volume_muted;
      if (service === "volume_up") {
        next.attributes.volume_level = Math.min(1, (st.attributes.volume_level ?? 0) + 0.05);
      }
      if (service === "volume_down") {
        next.attributes.volume_level = Math.max(0, (st.attributes.volume_level ?? 0) - 0.05);
      }
      if (service === "shuffle_set") next.attributes.shuffle = data.shuffle;
      if (service === "repeat_set") next.attributes.repeat = data.repeat;
      if (service === "join") {
        next.attributes.group_members = [
          ...(st.attributes.group_members ?? []), ...(data.group_members ?? []),
        ];
      }
      if (service === "unjoin") next.attributes.group_members = [];
      // Een paneel met een eigen code weigert stil, precies zoals de echte:
      // de aanroep slaagt en er verandert niets.
      if (service.startsWith("alarm_") && st.attributes.code_format && data.code !== "1234") {
        log(`${id} weigerde de code stil`, "err");
        continue;
      }
      if (service === "alarm_disarm") next.state = "disarmed";
      if (service === "alarm_arm_away") next.state = "armed_away";
      if (service === "alarm_arm_home") next.state = "armed_home";
      if (service === "media_next_track") next.attributes.media_title = "Het nummer hierna";
      if (service === "media_previous_track") next.attributes.media_title = "Het nummer hiervoor";
      // Een gezette tijd of datum komt terug als toestand, net als in een echt
      // huis: zo zie je of de kaart hem overneemt in plaats van terug te
      // springen naar wat er stond.
      if (service === "set_datetime" || service === "set_value") {
        if (data.datetime) next.state = String(data.datetime).replace("T", " ").slice(0, 19);
        else if (data.date && data.time) next.state = `${data.date} ${data.time}`;
        else if (data.date) next.state = data.date;
        else if (data.time) next.state = data.time;
      }
      if (service === "open_cover") next.state = "open";
      if (service === "close_cover") next.state = "closed";
      if (service === "set_cover_position") next.attributes.current_position = data.position;
      states[id] = next;
    }
    push();
  },
  formatEntityState: (st) =>
    ({ on: "Aan", off: "Uit", open: "Open", closed: "Dicht", unknown: "Onbekend",
       unavailable: "Niet bereikbaar", home: "Thuis", not_home: "Afwezig",
       disarmed: "Uitgeschakeld", heat: "Verwarmen", cloudy: "Bewolkt" }[st.state] ?? st.state),
  localize: () => undefined,
};

const cards = [];

/**
 * A fresh snapshot, exactly as Home Assistant hands one out.
 *
 * Never pass the live `states` object to a card. HA replaces state objects
 * rather than mutating them, and every card in the family leans on that to
 * decide whether a repaint is warranted. Handing over the live object makes the
 * card's previous hass and its new hass the same thing, so nothing ever looks
 * changed and the first interaction appears to do nothing.
 */
const snapshot = () => ({ ...hass, states: { ...states } });

function make(config, wrapClass) {
  const el = document.createElement(config.type.replace(/^custom:/, ""));
  try {
    el.setConfig(config);
  } catch (e) {
    log(`setConfig faalde voor ${config.type}: ${e.message}`, "err");
    const p = document.createElement("div");
    p.className = "err";
    p.textContent = `${config.type}: ${e.message}`;
    return p;
  }
  el.hass = snapshot();
  cards.push(el);
  if (!wrapClass) return el;
  const w = document.createElement("div");
  w.className = wrapClass;
  w.appendChild(el);
  return w;
}

const push = () => {
  const next = snapshot();
  for (const c of cards) c.hass = next;
};

/* ------------------------------------------------------------------ editors */

/**
 * Bevries als Home Assistant.
 *
 * `hui-dialog-edit-card` doet letterlijk `deepFreeze(ev.detail.config)` op het
 * object dat de editor meestuurt. Een editor die zijn eigen objecten weggeeft
 * kan ze daarna niet meer aanraken -- en dat was precies de fout die hier niet
 * omviel omdat de werkbank netjes bleef. Nu wel.
 */
function bevries(o) {
  if (o && typeof o === "object" && !Object.isFrozen(o)) {
    Object.freeze(o);
    for (const v of Object.values(o)) bevries(v);
  }
  return o;
}

/**
 * De editor hoort ook op de werkbank, met dezelfde lus als in Home Assistant.
 *
 * HA duwt de weggeschreven config bij ELKE wijziging terug via `setConfig`
 * (`hui-element-editor._handleUIConfigChanged` -> `value` -> `setConfig`). Zonder
 * die echo hier test je de helft: alles wat misgaat bij het terugkomen --
 * herbouwen onder een typend mens, bevroren objecten -- blijft dan onzichtbaar.
 */
function editor(titel, tag, config) {
  const h = document.createElement("h2");
  h.textContent = titel;

  const doos = document.createElement("div");
  doos.style.cssText =
    "background:#151513;border:1px solid rgba(232,228,222,.14);border-radius:14px;padding:14px";

  const ed = document.createElement(tag);
  ed.hass = snapshot();
  ed.setConfig(bevries(structuredClone(config)));
  ed.addEventListener("config-changed", (e) => {
    e.stopPropagation();
    const cfg = bevries(e.detail.config);
    uit.textContent = JSON.stringify(cfg, null, 1);
    ed.setConfig(cfg);
  });

  const uit = document.createElement("pre");
  uit.style.cssText =
    "margin:10px 0 0;font:11px/1.45 ui-monospace,monospace;color:#8fb9d6;white-space:pre-wrap";
  uit.textContent = JSON.stringify(config, null, 1);

  doos.append(ed, uit);
  const col = document.createElement("div");
  col.className = "col";
  col.append(h, doos);
  return col;
}

// Meet elke kaart: hoort een heel aantal Mushroom-rijen te zijn (56, 120, 184, 248...),
// en hoort dezelfde ronding te dragen als de rest van de familie.
//
// Die tweede kwam er later bij, en niet voor niets: de knopkaart bouwde zijn
// oppervlak zelf na met `--dac-radius-sm` in plaats van `--dac-radius`, en dan
// staat er op een dashboard een rolluikkaart met ronde hoeken en een knop
// eronder met scherpere. Dat is precies het soort verschil dat je pas ziet als
// ze naast elkaar staan -- dus meet het, in plaats van erop te vertrouwen.
requestAnimationFrame(() => {
  for (const c of cards) {
    const h = Math.round(c.getBoundingClientRect().height);
    const rows = c.getGridOptions?.().rows;
    const ideal = typeof rows === "number" ? rows * 56 + (rows - 1) * 8 : null;

    // Meet de doos die het vlak DRAAGT. Bij de entiteitenkaart mag dat de kaart
    // zelf zijn of elke plek apart (surface: items) -- en in dat laatste geval
    // heeft de kaart zelf geen hoek, dus zou meten aan .card altijd 0px geven
    // en dus altijd rood. Dan meet de werkbank het verkeerde ding en niet de
    // kaart de verkeerde hoek.
    const eigenVlak = c.shadowRoot?.querySelector(".it.surface");
    const doos = eigenVlak ?? c.shadowRoot?.querySelector(".card, .btn");
    const r = doos ? getComputedStyle(doos).borderTopLeftRadius : null;
    // 999px is de compacte pil, die mag afwijken; de rest hoort 20px te zijn.
    const radiusOk = !r || r === "20px" || parseFloat(r) > 100;

    const tag = document.createElement("div");
    tag.className = "h";
    tag.textContent = `${c.tagName.toLowerCase().replace("domotiapp-","").replace("-card","")}: ${h}px` +
      (ideal !== null ? `  |  ${rows} rij(en) = ${ideal}px  ${h === ideal ? "OK" : "AFWIJKING " + (h - ideal)}` : "  |  geen rows") +
      (r ? `  |  hoek ${r} ${radiusOk ? "" : "— WIJKT AF VAN DE FAMILIE"}` : "");
    if (!radiusOk) tag.style.color = "#d03b3b";
    c.parentElement?.insertBefore(tag, c.nextSibling);
  }
});
